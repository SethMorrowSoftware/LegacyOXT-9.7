# Tags main for the next release and starts it (Actions > Tag a release >
# Run workflow, on main). Adapted from OXT-Beyond's workflow of the same
# name:
#
#   - reads the version (BUILD_SHORT_VERSION, LiveCode's 9.7.0-dp-1) and makes the next tag
#     v<version>-r<n>, one more than the highest such tag (annotated,
#     "LiveCode Community <version>, release <n> built from this repository (LegacyOXT)"),
#     on the commit main points at, after checking that the three build
#     workflows and the pristine guard passed on that commit's push to main;
#   - starts release.yml on the new tag without "dry-run", which publishes
#     the release as a pushed tag would. (A tag pushed with this run's token
#     starts no workflow by itself, so it is started here; there is never a
#     second run from the tag push.)
#
# Permissions: contents: write for the tag, actions: write to start the
# release, in this job only.

name: Tag a release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tag-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  tag:
    name: Tag main and start the release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out main
        uses: actions/checkout@v7

      - name: Check the version, the tag and the builds
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          version=$(sed -n 's/^BUILD_SHORT_VERSION = *//p' version | tr -d '\r')
          version="${version#"${version%%[![:space:]]*}"}"
          version="${version%"${version##*[![:space:]]}"}"
          [[ $version =~ ^[0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]] ||
            fail "version (BUILD_SHORT_VERSION) contains '$version'; expected a version such as 9.7.0-dp-1"
          # The next release: one more than the highest v<version>-r<n> tag
          last=$(git ls-remote --tags --refs origin "refs/tags/v$version-r*" | sed 's|.*refs/tags/||' |
            while read -r t; do
              n=${t#"v$version-r"}
              if [[ $n =~ ^[1-9][0-9]*$ ]]; then echo "$n"; fi
            done | sort -n | tail -n 1)
          rebuild=$(( ${last:-0} + 1 ))
          tag="v$version-r$rebuild"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            fail "The tag $tag exists already; tags are never moved."
          fi
          for wf in build-windows.yml build-linux.yml build-macos.yml pristine-guard.yml; do
            conclusion=$(gh api "repos/$GH_REPO/actions/workflows/$wf/runs?head_sha=$GITHUB_SHA&event=push&per_page=1" \
              --jq '.workflow_runs[0] | if . == null then "not run" else (.conclusion // .status) end')
            [ "$conclusion" = success ] ||
              fail "$wf on the push of $GITHUB_SHA to main: $conclusion. Tag only a commit whose builds passed (run this again once they have)."
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "rebuild=$rebuild" >> "$GITHUB_OUTPUT"

      - name: Make and push the tag
        env:
          TAG: ${{ steps.check.outputs.tag }}
          VERSION: ${{ steps.check.outputs.version }}
          REBUILD: ${{ steps.check.outputs.rebuild }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "LiveCode Community $VERSION, release $REBUILD built from this repository (LegacyOXT)" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Start the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          gh workflow run release.yml --ref "$TAG" -f dry-run=false
          echo "Tagged \`$GITHUB_SHA\` as \`$TAG\` and started the Release workflow on it." >> "$GITHUB_STEP_SUMMARY"
